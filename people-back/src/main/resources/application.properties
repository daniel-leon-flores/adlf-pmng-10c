spring.application.name=people-back
server.port=${DC_SERVER_PORT}

db.host=${DC_DB_HOST}
db.port=${DC_DB_PORT}
db.name=${DC_DB_NAME}
db.user=${DC_DB_USER}
db.pass=${DC_DB_PASS}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
