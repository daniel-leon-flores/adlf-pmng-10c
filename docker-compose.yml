services:
  pmng-backend:
    image: backend:v1.0
    build: 
      context: ./people-back
    container_name: pmng-services
    environment: 
      DC_SERVER_PORT: ${ENV_SERVER_PORT}
      DC_DB_HOST: ${ENV_DB_HOST}
      DC_DB_PORT: ${ENV_DB_PORT}
      DC_DB_NAME: ${ENV_DB_NAME}
      DC_DB_USER: ${ENV_DB_USER}
      DC_DB_PASS: ${ENV_DB_PASS} 
    ports:
      - "8089:8080"
    networks:
      - pmng-net

  pmng-frontend:
    image: frontend:v1.0
    build: 
      context: ./people-front
    container_name: pmng-cliente
    ports:
      -"5173:80"

networks:
  pmng-net:
    external: true